name: Docs Hub CI

on:
  push:
    branches: [main, dev]
    paths:
      - "docs/site/**"
      - "docs/product/**"
      - "CHANGELOG.md"
      - "release.json"
      - "scripts/release.py"
      - ".github/workflows/docs-hub-ci.yml"
      - ".github/workflows/check.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "docs/site/**"
      - "release.json"
      - "scripts/release.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: docs
    env:
      AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_R2_ACCOUNT_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_SECRET }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT_S3_CLIENT }}
      R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Install and build
        run: bun install --frozen-lockfile && bun run build
        working-directory: docs/site
        env:
          VITE_APP_SITE_NAME: ${{ vars.VITE_APP_SITE_NAME }}

      - name: Check R2 credentials
        id: creds
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::R2 credentials not configured — skipping deploy"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate R2 endpoint
        if: steps.creds.outputs.present == 'true'
        run: |
          if [ -z "$R2_ENDPOINT" ]; then echo "::error::CLOUDFLARE_R2_ENDPOINT_S3_CLIENT repo variable is not set"; exit 1; fi
          case "$R2_ENDPOINT" in https://*) ;; *) echo "::error::CLOUDFLARE_R2_ENDPOINT_S3_CLIENT must start with https:// (got: $R2_ENDPOINT)"; exit 1;; esac
          if [ -z "$R2_BUCKET" ]; then echo "::error::CLOUDFLARE_R2_BUCKET_ID repo variable is not set"; exit 1; fi

      # Root-only deploy (ADR 0001): individual files, NEVER `sync --delete`
      # on the bucket root — that would wipe the <app>/ prefixes.
      - name: Sync landing assets (no prefix delete)
        if: steps.creds.outputs.present == 'true'
        run: |
          aws s3 sync docs/site/dist/assets "s3://$R2_BUCKET/assets" \
            --endpoint-url "$R2_ENDPOINT" --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Copy landing entry files (no-cache)
        if: steps.creds.outputs.present == 'true'
        run: |
          aws s3 cp docs/site/dist/index.html "s3://$R2_BUCKET/index.html" \
            --endpoint-url "$R2_ENDPOINT" --content-type "text/html; charset=utf-8" --cache-control "no-cache"
          for f in favicon.svg robots.txt sitemap.xml; do
            if [ -f "docs/site/dist/$f" ]; then
              aws s3 cp "docs/site/dist/$f" "s3://$R2_BUCKET/$f" \
                --endpoint-url "$R2_ENDPOINT" --cache-control "public, max-age=86400"
            fi
          done
